<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
    }

    .muted {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .auth-box {
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 16px;
      background: #fafafa;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
    }

    button {
      background: #0b6bcb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0958a8;
    }

    .secondary {
      background: #666;
    }

    .secondary:hover {
      background: #555;
    }

    .danger {
      background: #c0392b;
    }

    .danger:hover {
      background: #a93226;
    }

    .ghost {
      background: #f1f1f1;
      color: #222;
      border: 1px solid #ccc;
    }

    .ghost:hover {
      background: #e7e7e7;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .success {
      background: #eaf7ea;
      color: #1e6b2c;
    }

    .error {
      background: #fdeaea;
      color: #9f1f1f;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .top-actions button {
      width: auto;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-actions button {
      width: auto;
      min-width: 140px;
    }

    .application-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      background: #fafafa;
    }

    .application-card strong {
      font-size: 15px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .card-actions button {
      width: auto;
      min-width: 100px;
    }

    @media (max-width: 700px) {
      .auth-grid {
        grid-template-columns: 1fr;
      }

      .form-actions button,
      .card-actions button,
      .top-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Job Application Tracker</h1>
    <p class="muted">Simple frontend for your FastAPI backend.</p>

    <div id="message-box"></div>

    <section id="auth-section">
      <div class="auth-grid">
        <div class="auth-box">
          <h2>Register</h2>
          <form id="register-form">
            <label for="register-full-name">Full Name</label>
            <input type="text" id="register-full-name">

            <label for="register-email">Email</label>
            <input type="email" id="register-email" required>

            <label for="register-password">Password</label>
            <input type="password" id="register-password" required>

            <button type="submit">Register</button>
          </form>
        </div>

        <div class="auth-box">
          <h2>Login</h2>
          <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
          </form>
        </div>
      </div>
    </section>

    <section id="app-section" class="hidden">
      <div class="top-actions">
        <button id="load-applications-btn" type="button">Load Applications</button>
        <button id="logout-btn" type="button" class="secondary">Logout</button>
      </div>

      <h2>Add / Edit Application</h2>
      <form id="application-form">
        <input type="hidden" id="application-id">

        <label for="job_title">Job Title</label>
        <input type="text" id="job_title" required>

        <label for="company_name">Company Name</label>
        <input type="text" id="company_name" required>

        <label for="status">Status</label>
        <select id="status" required>
          <option value="saved">saved</option>
          <option value="applied">applied</option>
          <option value="interview">interview</option>
          <option value="offer">offer</option>
          <option value="rejected">rejected</option>
        </select>

        <label for="source">Source</label>
        <input type="text" id="source">

        <label for="application_url">Application URL</label>
        <input type="url" id="application_url">

        <label for="salary_text">Salary Text</label>
        <input type="text" id="salary_text">

        <label for="applied_on">Applied On</label>
        <input type="date" id="applied_on">

        <label for="notes">Notes</label>
        <textarea id="notes" rows="4"></textarea>

        <div class="form-actions">
          <button type="submit">Save Application</button>
          <button type="button" id="cancel-edit-btn" class="ghost">Cancel Edit</button>
        </div>
      </form>

      <h2 style="margin-top: 28px;">Your Applications</h2>
      <div id="applications-list"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
