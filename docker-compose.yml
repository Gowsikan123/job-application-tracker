version: "3.9"

services:
  api:
    build: .
    container_name: job_tracker_api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: job_tracker_db
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: job_tracker_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: